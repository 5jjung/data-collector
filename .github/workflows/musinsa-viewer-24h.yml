# ============================================================
# 좋아요 + 실시간 보는 사람 수 — 매일 24시간 30분마다
# - MONITOR_MODE=viewer : 좋아요/시청자 수집 + 리스팅 이탈 추적만 실행 (품절 옵션 감시는 안 함)
# - 좋아요/시청자 슬랙은 24시간 발송.
# - 리스팅 이탈 품절 알림(🚨/⚠️/↩️)은 코드에서 평일 업무시간 + 상품등록 D열 ON 상품만 발송.
# ============================================================
name: 무신사 좋아요 및 실시간 보는 사람 수 (24시간)

on:
  schedule:
    # 매일 00분, 30분 실행 (UTC 및 KST 모두 30분 간격)
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: musinsa-integrated-monitor
  cancel-in-progress: false

jobs:
  viewer-monitor:
    runs-on: ubuntu-latest
    # [수정] 멈춘 실행이 그룹을 6시간 동안 막지 않도록 25분에서 강제 종료
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: viewer-monitor
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 패키지 설치
        run: npm install
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 좋아요 및 실시간 보는 사람 수 수집
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VIEWER_SPREADSHEET_ID: ${{ vars.OPERATING_SPREADSHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_VIEWER }}
          MONITOR_MODE: viewer
        run: node collect_viewers.js
