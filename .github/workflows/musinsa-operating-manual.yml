# ============================================================
# 운영 시트 수동 검증 (수동 실행 전용)
# ※ viewer-monitor.yml 의 수동 실행(mode 선택)과 기능이 같습니다. 필요 없으면 이 파일은 지워도 됩니다.
# [수정] 1) concurrency 그룹을 다른 운영 워크플로와 같게 → 예약 실행과 동시에 시트를 덮어쓰는 사고 방지
#        2) 품절 웹훅을 SLACK_WEBHOOK_STOCK 으로 통일 (예전엔 SLACK_WEBHOOK_URL 이라 다른 채널로 갔을 수 있음)
# ============================================================
name: 무신사 운영 시트 수동 검증 (26FW)

on:
  workflow_dispatch:

concurrency:
  group: musinsa-integrated-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: viewer-monitor
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 패키지 설치
        run: npm install
      - name: Playwright 설치
        run: npx playwright install --with-deps chromium
      - name: 운영 시트 수동 수집
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VIEWER_SPREADSHEET_ID: ${{ vars.OPERATING_SPREADSHEET_ID }}
          MONITOR_MODE: both
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_VIEWER }}
          SLACK_WEBHOOK_STOCK: ${{ secrets.SLACK_WEBHOOK_STOCK }}
        run: node collect_viewers.js
