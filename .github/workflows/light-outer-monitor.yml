# ============================================================
# 무신사 랭킹 1~500위 "경량 아우터" 30분 단위 자동 수집
# 코드 위치: light-outer-monitor/
# ------------------------------------------------------------
# - 매시 00분 / 30분 실행 (한국시간 = UTC+9 이므로 분 단위는 동일)
#   ※ GitHub 예약 실행은 서버 사정으로 수 분~수십 분 늦거나 드물게 건너뛸 수 있음
#     → 데이터에는 "수집슬롯_KST"(정각/30분) 와 "수집일시_KST"(실제) 가 같이 기록됨
# - 저장: 누적 CSV 를 데이터 전용 브랜치 "light-outer-data" 에 커밋
#   (main 브랜치 코드 이력이 데이터 커밋으로 지저분해지지 않도록 분리)
# - concurrency: 이전 실행이 끝나지 않았으면 다음 실행은 "대기"(취소/동시실행 X)
# - 수동 실행: Actions 탭 → 이 워크플로 → Run workflow
#     mode = collect(수집) / probe(페이지 구조 진단)
# ============================================================
name: 랭킹 경량아우터 30분 수집

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect = 수집 / probe = 페이지 구조 진단'
        required: true
        default: collect
        type: choice
        options: [collect, probe]

# 데이터 브랜치에 CSV 를 커밋/푸시하기 위한 권한
permissions:
  contents: write

# 중복 실행 방지: 같은 그룹은 한 번에 1개만 실행, 진행 중인 실행은 취소하지 않음
concurrency:
  group: light-outer-monitor
  cancel-in-progress: false

env:
  DATA_BRANCH: light-outer-data # ✏️ 누적 CSV 를 저장할 브랜치 이름

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 28 # 30분 주기와 겹치지 않도록 강제 종료 시간
    defaults:
      run:
        working-directory: light-outer-monitor
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: light-outer-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 브라우저 설치 캐시 (매 30분마다 다운로드하지 않도록)
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('light-outer-monitor/package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # 데이터 브랜치를 data-store 폴더로 받아옴 (처음이면 빈 브랜치 생성)
      - name: Prepare data branch
        if: github.event_name == 'schedule' || inputs.mode == 'collect'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add -B "$DATA_BRANCH" data-store FETCH_HEAD
          else
            git worktree add --detach data-store
            git -C data-store checkout --orphan "$DATA_BRANCH"
            git -C data-store rm -rfq .
          fi

      - name: Run collector
        if: github.event_name == 'schedule' || inputs.mode == 'collect'
        env:
          DATA_DIR: ${{ github.workspace }}/data-store/light-outer
          MAX_DETAIL_PER_RUN: ${{ vars.MAX_DETAIL_PER_RUN }}
        run: npm start

      # 수집 결과 CSV 커밋 & 푸시 (수집이 일부 실패해도 저장된 행/로그는 커밋)
      - name: Commit CSV to data branch
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'collect')
        working-directory: data-store
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "변경된 CSV 없음"
            exit 0
          fi
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4; do
            git push origin "HEAD:$DATA_BRANCH" && exit 0
            echo "푸시 실패 → 원격 변경 반영 후 재시도 ($i)"
            sleep $((i * 5))
            git pull --rebase --depth=1 origin "$DATA_BRANCH" || true
          done
          exit 1

      - name: Run probe (구조 진단)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: npm run probe

      # 회차별 임시 파일(랭킹 500위 전체, 실패 상세, 진단 스크린샷) → Artifacts 30일 보관
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: light-outer-monitor/output/
          retention-days: 30
          if-no-files-found: ignore
