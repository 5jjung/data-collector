# ============================================================
# 좋아요·실시간 보는 사람 수 + 품절(옵션) 통합 모니터링 — 이 파일 하나로 자동 실행
# - 30분마다 24시간 실행 (매시 7분/37분, 정시는 GitHub 혼잡으로 밀려서 피함)
# - 한국시간 평일 09:07~18:37 : MONITOR_MODE=both  (보는 사람 수 → 품절 순서로 둘 다)
# - 그 외 시간(평일 밤·새벽, 주말 종일) : MONITOR_MODE=viewer (보는 사람 수만)
# - 품절 슬랙 허용 시간은 코드의 STOCK_SLACK_HOURS에서 한 번 더 거릅니다.
# - 수동 실행(Run workflow)은 mode 선택 가능 (기본 both).
# - 예전 musinsa-viewer-24h.yml 역할을 이 파일로 합쳤습니다.
# ============================================================
name: 실시간 관심고객수 + 품절 통합 모니터링

on:
  schedule:
  # (UTC 기준 cron, 한국시간 = UTC+9)
  # 1) 한국시간 평일 09:07~18:37 → both (보는 사람 수 + 품절)
  - cron: '7,37 0-9 * * 1-5'
  # 2) 한국시간 매일 19:07~다음날 08:37 → viewer (보는 사람 수만)
  - cron: '7,37 10-23 * * *'
  # 3) 한국시간 토·일 09:07~18:37 → viewer (보는 사람 수만)
  - cron: '7,37 0-9 * * 0,6'
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 대상'
        required: true
        default: both
        type: choice
        options:
          - both
          - stock
          - viewer

# 같은 시트를 쓰는 워크플로는 모두 같은 그룹 → 동시에 두 개가 시트를 덮어쓰지 않게 줄 세움
concurrency:
  group: musinsa-integrated-monitor
  cancel-in-progress: false

jobs:
  check-monitor:
    runs-on: ubuntu-latest
    # [수정] 멈춘 실행이 그룹을 6시간 동안 막지 않도록 25분에서 강제 종료
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: viewer-monitor
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 패키지 설치
        run: npm install
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 통합 모니터링 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VIEWER_SPREADSHEET_ID: ${{ vars.OPERATING_SPREADSHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_VIEWER }}
          SLACK_WEBHOOK_STOCK: ${{ secrets.SLACK_WEBHOOK_STOCK }}
          MONITOR_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7,37 0-9 * * 1-5' && 'both') || 'viewer' }}
        run: node collect_viewers.js
