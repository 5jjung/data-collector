name: 실시간 관심고객수 + 품절 통합 모니터링

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 대상'
        required: true
        default: both
        type: choice
        options:
          - both
          - viewer
          - stock

concurrency:
  group: musinsa-integrated-monitor
  cancel-in-progress: false

jobs:
  check-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: viewer-monitor
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 패키지 설치
        run: npm install
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 통합 모니터링 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VIEWER_SPREADSHEET_ID: ${{ secrets.VIEWER_SPREADSHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_VIEWER }}
          SLACK_WEBHOOK_STOCK: ${{ secrets.SLACK_WEBHOOK_STOCK }}
          MONITOR_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: node collect_viewers.js
